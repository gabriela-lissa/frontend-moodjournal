<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mood Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🌷 Mood Journal</h1>

  <!-- FORM -->
  <div class="card">
    <h2>Novo registro</h2>

    <input id="humor" placeholder="Seu humor (feliz, ansiosa...)" />
    <input id="nota" type="number" placeholder="Nota (0-10)" />
    <textarea id="descricao" placeholder="Como foi seu dia..."></textarea>

    <button onclick="salvarMood()">Salvar</button>
  </div>

  <!-- LISTA -->
  <div class="card">
    <h2>Seus dias 💌</h2>
    <div id="lista"></div>
  </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
